# Practitioner pay config for the Commission Calculator (v26.10).
#
# Each practitioner has:
#   - hourly_rate            ex-super, ex-GST AUD/hour
#   - commission_pct         e.g. 0.40 for 40%
#   - hours_per_day          weekly schedule, used to compute monthly hours
#   - recurring_deductions   monthly hour deductions (catch-ups, leadership, etc)
#   - aliases                optional Cliniko-name variants for matching
#   - region                 v27.0 — one of albury_wodonga / mudgeeraba / mulgrave
#                              (drives the region selector in the Commission tab)
#
# Per-month manual adjustments (GP meetings, ad-hoc mentoring) are entered
# in the Commission tab UI, not here. They subtract from hours just like
# recurring_deductions but vary month-to-month.

# Super (SG) rate for the bonus back-out: bonus_pre_super = gap / (1+super)
# Australia's SG steps from 12.0% to 12.5% on 1 July 2026.
super_rate_default: 0.12
super_rate_changes:
  - effective_from: 2026-07-01
    rate: 0.125

# These deductions apply to anyone who doesn't override them per-practitioner.
# Currently Patrick / Alesha / Maya / Chris / Mitch all attend; Chris is 2hrs
# (overridden below). Others omit them by setting their own block to {}.
default_recurring_deductions:
  "Staff catch-ups":   4.0   # hours/month
  "Leadership meeting": 1.0  # hours/month

# v26.11.4 — managers (Patrick, Maya, Alesha) get an additional
# "Quarterly catch-up with Matt" averaged to 0.67hrs/month across
# the year. Non-managers (Chris + everyone else) don't.
manager_extra_recurring_deductions:
  "Quarterly catch-up (Matt, avg)": 0.67

