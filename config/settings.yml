# Dashboard configuration.
# All thresholds and keyword lists live here so you can tune them without
# editing Python code. Reload the dashboard after any change.

timezone: Australia/Sydney
financial_year_start_month: 7   # AU FY: Jul 1

# v27.0 — Multi-org Cliniko. Each business has its own Cliniko organisation
# and API key. Data is fetched per-org and aggregated by the dashboard.
# The `default: true` org is the fallback when no clinic filter is active
# (used by tabs that haven't been migrated to multi-org yet).
# Add or remove orgs as your clinic footprint changes; secrets go in
# Streamlit Cloud → Manage app → Secrets (never commit API keys to git).
cliniko_organizations:
  - key: albury_wodonga
    name: Albury/Wodonga
    display_name: Enhance Physio Albury/Wodonga
    api_key_env: CLINIKO_API_KEY               # existing single-org secret
    shard: au1
    default: true
  - key: mudgeeraba
    name: Gold Coast (Mudgeeraba)
    display_name: Enhance Physio Mudgeeraba
    api_key_env: CLINIKO_API_KEY_MUDGEERABA
    shard: au1
  - key: mulgrave
    name: Melbourne (Mulgrave)
    display_name: Enhance Physio Mulgrave
    api_key_env: CLINIKO_API_KEY_MULGRAVE
    shard: au1

# v26.11.2 — Commission calculator item filtering. Cliniko often bills
# non-service fees (DNA, room hire, products) as line items on a regular
# appointment, so filtering by appt type alone misses them. Match by
# invoice-item name and/or code. Patterns are regex (case-insensitive
# for names, case-sensitive for codes because codes are canonical).
commission:
  use_ex_tax: true              # match Cliniko's "Amount (ex. tax)" column
  excluded_item_name_patterns:
    - 'did not arrive'
    - '\bDNA\b'
    - 'room hire'
    - 'MLCOA'                   # covers MLCOA Room Hire + MLCOA Video Assessment
  excluded_item_code_patterns:
    - '^DNA$'
    - '^MLCOARH$'
    - '^MLCOAVA$'

# Utilisation — keywords used to classify unavailable_blocks.
# Case-insensitive substring match.
utilisation:
  # Denominator = days_worked × standard_hours_per_day.
  # If your full-time roster is an 8-hour clinic day, leave at 8.
  # 7.6 is common for clinics that exclude a paid break.
  standard_hours_per_day: 8.0
  qualifying_keywords:
    - billable report
    - case conference
    - billable
    - mentoring
    - monthly meeting
    - inservice
    - catch up
    - excellence program
  excluded_keywords:
    - showing
    - do not book
    - hold
    - lunch
    - break
  # v26.6.2: days_worked subtracts ONLY these keywords from the working
  # window. "Do not book" / "hold" / "showing" are manual overrides the
  # practitioner put in while still on-site — they should not reduce the
  # days-worked count. Only genuine off-clock time does.
  # (These still subtract from the utilisation denominator via the
  # excluded_keywords list above — that behaviour is unchanged.)
  break_keywords:
    - lunch
    - break

  # v26.7: leave-type blocks ALSO reduce available time for days_worked
  # (annual leave, sick leave, personal leave, public holidays). These
  # use full regex so short codes like "AL"/"SL"/"PL"/"PH" get
  # word-boundary matching (otherwise "AL" would false-match "Albury",
  # "PL" would match "plan", etc). Longer phrases are substring-matched.
  # Case-insensitive throughout ((?i) prefix).
  # Checked BEFORE qualifying_keywords so a block labelled "AL billable"
  # still counts as leave, not admin work.
  # Like break_keywords, leave minutes subtract from BOTH days_worked AND
  # the utilisation denominator (so leave days don't drag your % down).
  leave_patterns:
    # Short leave codes — word-boundary required to avoid false matches
    - '(?i)\bAL\b'              # Annual Leave
    - '(?i)\bSL\b'              # Sick Leave
    - '(?i)\bPL\b'              # Personal Leave
    - '(?i)\bPH\b'              # Public Holiday
    - '(?i)\bLSL\b'             # Long Service Leave
    # Full leave phrases
    - '(?i)annual leave'
    - '(?i)sick leave'
    - '(?i)personal leave'
    - '(?i)carer.?s? leave'
    - '(?i)parental leave'
    - '(?i)maternity leave'
    - '(?i)paternity leave'
    - '(?i)bereavement'
    - '(?i)compassionate'
    - '(?i)unpaid leave'
    - '(?i)long service'
    - '(?i)study leave'
    - '(?i)leave of absence'
    - '(?i)public holiday'
    - '(?i)on leave'
    # Fortnightly-roster workaround — Cliniko only supports weekly rosters,
    # so practitioners on a fortnightly pattern manually block the days
    # they don't work. Those blocks should reduce days_worked.
    - '(?i)does not work'
    - '(?i)doesn.?t work'       # "doesn't work" / "doesnt work"
    - '(?i)not working'
    - '(?i)day off'
    - '(?i)rostered off'
    - '(?i)\bRDO\b'             # Rostered Day Off
    - '(?i)non.?working'        # "non-working" or "non working"
    # Common Australian public holidays (so a block just named
    # "Christmas" or "ANZAC" still counts as leave)
    - '(?i)new year'
    - '(?i)australia day'
    - '(?i)good friday'
    - '(?i)easter'              # Easter Monday/Sunday/Saturday
    - '(?i)\banzac\b'
    - '(?i)king.?s birthday'
    - '(?i)queen.?s birthday'
    - '(?i)labour day'
    - '(?i)labor day'
    - '(?i)melbourne cup'
    - '(?i)christmas'
    - '(?i)xmas'
    - '(?i)boxing day'

# v26.9 — Clinical Review (long-duration / under-servicing audit)
# Flags patients who are still being seen but past the threshold for
# their funding bucket — opportunity for clinical review, second
# opinion, internal/external referral, etc.
# Also flags initial-only patients who never came back (under-servicing).
clinical_review:
  # "Still being treated" gate — only flag patients with a delivered
  # appt in this window, OR a future booking. Stops the queue filling
  # up with patients who've already finished/churned.
  active_window_days: 14

  # Under-servicing — only flag if it's been at least this many days
  # since the initial (avoids flagging today's patient who hasn't yet
  # rebooked).
  under_servicing_min_days: 14

  # Per-funding-bucket thresholds. max_appts and max_days are EITHER
  # triggers — flag if either exceeded. Set null to ignore that axis.
  buckets:
    Private/EPC:    { max_appts: 20, max_days: 90 }
    VIC WorkCover:  { max_appts: 36, max_days: 252 }   # 3× PMP @ 12 weeks
    NSW WorkCover:  { max_appts: 40, max_days: null }  # 5× AHTR @ 8 appts
    TAC:            { max_appts: 30, max_days: null }
    DVA:            { max_appts: 30, max_days: null }
    NDIS:           { max_appts: 30, max_days: null }

# v26.8 — Injury-area analytics
# Categorises every initial-consult treatment note into one of 12 buckets.
# Pass A reads the "Area of Injury" checkbox question directly; Pass B
# falls back to keyword-scanning the HoPC paragraph.
# All keyword matching is case-insensitive with word boundaries (so "hip"
# matches "hip" but not "ship"). To handle plurals/compounds, list common
# forms explicitly (e.g. both "knee" and "kneecap").
injuries:
  area_question_names:
    - 'Area of Injury'
    - 'Injury Area'
    - 'Body Region'
    - 'Region'
    - 'Area'
  presenting_complaint_names:
