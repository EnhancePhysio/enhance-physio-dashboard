# Audit — 5 checks applied to every new EPC + Private patient.
audit:
  # How long a per-patient audit result stays valid before it's re-run.
  # Set to 0 to disable expiry (cached forever). 30 days is a sensible
  # default: long enough that weekly/monthly audits reuse prior work, short
  # enough that a patient whose RAP was uploaded late still gets re-checked.
  cache_ttl_days: 30

  # Check 1: RAP attachment
  rap_attachment_pattern: '(?i)(RAP|Recommended Action Plan)'

  # Check 2: Wibbi exercises
  wibbi_uploader_name: 'Matthew Lewington'
  wibbi_name_pattern: '(?i)(wibbi|HEP|exercise|exercises|gym)'

  # Check 3: Correspondence — referrer sources that are N/A (no letter expected).
  # Per Matt's v26.4 rule, a letter is required for ALL EPC patients + any
  # Private patient referred by a Contact (i.e. a named doctor in Cliniko's
  # Contacts). Generic/social sources below stay N/A.
  correspondence_na_referrer_values:
    - ''
    - google
    - facebook
    - instagram
    - social media
    - family
    - friend
    - self
    - self-referral
    - word of mouth
    - sporting club
    - sports club
    - sport
    - club
    - gym
    - walk-in
    - walk in

  # RAP / Wibbi clinical-reason fallback — if missing, look for these terms
  # in the patient's treatment notes. Match = N/A (not fail).
  clinical_fallback_keywords:
    - awaiting imaging
    - travelling
    - travel
    - casted
    - cast
    - splint
    - hospital

# PPVA — appointment types considered "private" (includes EPC)
ppva:
  private_name_patterns:
    - '(?i)private'
    - '(?i)EPC'
  excluded_name_patterns:
    - '(?i)ndis'
    - '(?i)dva'
    - '(?i)workcover'
    - '(?i)tac'

# Notes completion window (hours)
notes_completion_window_hours: 24

# Punctuality buckets (minutes late, upper bound inclusive)
punctuality:
  buckets:
    - name: '0-5'
      max_minutes: 5
    - name: '6-10'
      max_minutes: 10
    - name: '11-14'
      max_minutes: 14
    - name: '15+'
      max_minutes: null     # open-ended
  # rubric score denominator = total; numerator = sum of 0-5 + 6-10 + 11-14
  rubric_score_formula: 'within_15_min_percent'
  leave_status_values:
    - off
    - leave
    - sick
    - na

# Matrix zones (percentage of max band = score/10)
matrix:
  zones:
    red:     { clin_max: 0.50, nonclin_max: 0.50 }
    orange:  { clin_min: 0.50, nonclin_max: 0.50 }
    blue:    { clin_max: 0.50, nonclin_min: 0.50 }
    gold:    { clin_min: 0.75, nonclin_min: 0.75 }
    # Green = anything that doesn't match the others (the "expected" middle band)

# New-patient detection
# Signal 1 (always on): patients whose attended appt type matches an
# "Initial / New Patient / Assessment" name pattern.
# Signal 2 (optional, slow): scan /patients for those created in range.
# Turn on only when you need DVA/NDIS/TAC/NSW WorkCover first-timers
# counted — they don't have dedicated Initial appt types, so Signal 1
# misses them. Adds ~20-50 API calls per metric refresh depending on
# clinic size.
new_patients:
  scan_patients: false
  scan_patients_max_pages: 20   # hard cap = 2000 records checked

# Rate limiting
cliniko:
  base_url_template: 'https://api.{shard}.cliniko.com/v1'
  requests_per_minute: 180    # Leave headroom under the 200/min cap
  page_size: 100
  cache_ttl_seconds: 1800     # 30 min Streamlit cache — first load is slow,
                               # subsequent loads in the same session are instant
